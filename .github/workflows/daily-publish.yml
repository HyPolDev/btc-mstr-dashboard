name: Refresh and publish dashboard
on:
  schedule:
    # 17:37 New York in winter, 18:37 in summer; after either regular close.
    - cron: '37 22 * * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh public sources before publishing (disable to republish saved data)
        type: boolean
        default: true
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: dashboard-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.persist.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh independent public datasets
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        env:
          ISSUER_DELIVERY_TOKEN: ${{ secrets.ISSUER_DELIVERY_TOKEN }}
        run: python scripts/refresh.py
      - run: python -m unittest discover -s tests
      - run: node --test tests/*.test.mjs
      - run: node --check app.js
      - name: Validate public snapshot and record run provenance
        env:
          ISSUER_DELIVERY_TOKEN: ${{ secrets.ISSUER_DELIVERY_TOKEN }}
        run: python scripts/validate.py
      - run: python scripts/build.py
      - name: Persist validated public observations
        id: persist
        # The GITHUB_TOKEN push does not retrigger workflows. This run deploys below.
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data docs
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh validated public dashboard data [skip ci]'
            git push origin HEAD:main
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-refresh-data
          path: data
          retention-days: 30
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy this run directly to Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build.py
      - name: Verify deployed data and application files
        run: python scripts/verify_deployment.py
