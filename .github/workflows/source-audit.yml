name: Audit public issuer sources
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: source-audit
          path: source-audit
          retention-days: 7
